<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVESTBOT_RECEIPT</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    * { box-sizing: border-box; }

    body {
        background-color: #d4d4d4;
        font-family: 'Courier New', Courier, monospace;
        color: #000;
        margin: 0;
        padding: 20px;
    }

    .receipt {
        max-width: 400px;
        margin: 0 auto;
        background-color: #fff;
        padding: 20px;
        border: 1px solid #bbb;
    }

    .dashed {
        border-bottom: 1px dashed #000;
        margin: 10px 0;
    }

    button {
        background: #fff;
        border: 2px solid #000;
        color: #000;
        font-family: 'Courier New', monospace;
        font-weight: bold;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 12px;
    }

    button:active {
        background: #000;
        color: #fff;
    }

    .crash-btn {
        background: #ff0000;
        color: #fff;
        border: 2px solid #000;
        width: 100%;
        padding: 10px;
        font-size: 14px;
        margin: 10px 0;
    }

    .yolo-btn {
        background: #000;
        color: #fff;
        border: 2px solid #000;
        width: 100%;
        padding: 10px;
        font-size: 14px;
        margin: 10px 0;
    }

    .reset-btn {
        background: #fff;
        color: #000;
        border: 2px solid #000;
        width: 100%;
        padding: 6px;
        font-size: 11px;
        margin: 5px 0;
    }

    /* Summary */
    .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .summary-cell {
        border: 1px solid #000;
        padding: 8px;
        text-align: center;
    }

    .summary-cell h3 {
        margin: 0 0 4px 0;
        font-size: 10px;
        text-transform: uppercase;
        font-weight: bold;
    }

    .big-num {
        font-size: 14px;
        font-weight: bold;
    }

    .up { color: #1a800d; }
    .down { color: #cc0000; }

    /* Stock cells */
    .stock-cell {
        border: 1px solid #000;
        padding: 10px;
        margin-bottom: 8px;
    }

    .green-border { border-left: 4px solid #1a800d; }
    .red-border { border-left: 4px solid #cc0000; }

    .stock-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 4px;
    }

    .stock-name {
        font-size: 12px;
        font-weight: bold;
    }

    .stock-ticker {
        font-size: 10px;
        color: #666;
    }

    .stock-price {
        font-size: 16px;
        font-weight: bold;
        margin: 4px 0;
    }

    .stock-change {
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 4px;
    }

    .stock-owned {
        font-size: 10px;
        margin-bottom: 8px;
    }

    .trade-row {
        display: flex;
        gap: 4px;
        align-items: center;
    }

    .trade-row input {
        width: 40px;
        font-family: 'Courier New', monospace;
        border: 1px solid #000;
        padding: 2px 4px;
        font-size: 11px;
    }

    .buy-btn { background: #1a800d; color: #fff; }
    .sell-btn { background: #cc0000; color: #fff; }

    /* the line chart so its visible*/
    .chart-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 4px;
    }

    .chart-controls select {
        font-family: 'Courier New', monospace;
        border: 1px solid #000;
        padding: 2px 4px;
        font-size: 11px;
    }

    .tf-buttons {
        display: flex;
        gap: 2px;
    }

    .tf-buttons button {
        padding: 2px 6px;
        font-size: 10px;
    }

    .tf-buttons button.active {
        background: #000;
        color: #fff;
    }

    .chart-container {
        height: 200px;
        margin-bottom: 8px;
    }

    /* Signals */
    .signals {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
    }

    .signal {
        font-size: 9px;
        padding: 4px;
        border: 1px solid #000;
        text-align: center;
        font-weight: bold;
    }

    .sig-buy { background: #e8f5e9; color: #1a800d; }
    .sig-sell { background: #ffebee; color: #cc0000; }
    .sig-hold { background: #f5f5f5; color: #666; }

    /* alerts*/
    .alert-section {
        margin-bottom: 8px;
    }

    .alert-row {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
        align-items: center;
        flex-wrap: wrap;
    }

    .alert-row select, .alert-row input {
        font-family: 'Courier New', monospace;
        border: 1px solid #000;
        padding: 2px 4px;
        font-size: 11px;
    }

    .alert-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        padding: 4px;
        border: 1px dashed #000;
        margin-bottom: 4px;
    }

    .alert-item button {
        padding: 2px 6px;
        font-size: 9px;
    }

    /*buy/sell things shown*/
    .txn-log {
        max-height: 200px;
        overflow-y: auto;
    }

    .txn-line {
        font-size: 10px;
        padding: 2px 0;
        border-bottom: 1px dotted #ccc;
    }

    .txn-buy { color: #1a800d; font-weight: bold; }
    .txn-sell { color: #cc0000; font-weight: bold; }
    .txn-crash { color: #ff6600; font-weight: bold; }

    .empty {
        font-size: 11px;
        color: #666;
        text-align: center;
        padding: 10px;
    }

    /*controls and buttons*/
    .controls-row {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    .controls-row select {
        font-family: 'Courier New', monospace;
        border: 1px solid #000;
        padding: 2px 4px;
        font-size: 11px;
        flex: 1;
    }

    /*some weird thing*/
    #toasts {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .toast {
        background: #000;
        color: #fff;
        padding: 8px 12px;
        font-size: 11px;
        font-family: 'Courier New', monospace;
        border: 2px solid #000;
        animation: slideIn 0.3s ease;
    }

    .toast.alert {
        background: #ff0000;
        color: #fff;
    }

    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }

    /*themes*/
    body.amber {
        background-color: #1a1a1a;
    }

    body.amber .receipt {
        background-color: #000;
        color: #ffb000;
        border-color: #ffb000;
    }

    body.amber button {
        background: #000;
        color: #ffb000;
        border-color: #ffb000;
    }

    body.amber button:active {
        background: #ffb000;
        color: #000;
    }

    body.amber .dashed {
        border-bottom-color: #ffb000;
    }

    body.amber input, body.amber select {
        background: #000;
        color: #ffb000;
        border-color: #ffb000;
    }

    body.amber .summary-cell,
    body.amber .stock-cell,
    body.amber .signal,
    body.amber .alert-item {
        border-color: #ffb000;
    }

    body.amber .green-border { border-left-color: #33ff00; }
    body.amber .red-border { border-left-color: #ff3333; }
    body.amber .up { color: #33ff00; }
    body.amber .down { color: #ff3333; }
    body.amber .txn-buy { color: #33ff00; }
    body.amber .txn-sell { color: #ff3333; }
    body.amber .txn-crash { color: #ffaa00; }
    body.amber .buy-btn { background: #33ff00; color: #000; }
    body.amber .sell-btn { background: #ff3333; color: #000; }
    body.amber .sig-buy { background: #0d1f0d; color: #33ff00; }
    body.amber .sig-sell { background: #1f0d0d; color: #ff3333; }
    body.amber .sig-hold { background: #1a1a1a; color: #ffb000; }
    body.amber .empty { color: #666; }
    body.amber .stock-ticker { color: #999; }
    body.amber .txn-line { border-bottom-color: #333; }
    body.amber .yolo-btn { background: #ffb000; color: #000; border-color: #ffb000; }
    body.amber .reset-btn { background: #000; color: #ffb000; border-color: #ffb000; }

    .demo-badge {
        text-align: center;
        font-size: 10px;
        padding: 4px;
        border: 1px dashed #000;
        margin-bottom: 8px;
    }

    body.amber .demo-badge {
        border-color: #ffb000;
    }

    .sep {
        border-bottom: 1px solid #000;
        margin: 8px 0;
    }

    body.amber .sep {
        border-bottom-color: #ffb000;
    }

    .prompt-amber {
        color: #ffb000;
    }

    h2 {
        font-size: 12px;
        margin: 8px 0 6px 0;
        font-family: 'Courier New', monospace;
    }
</style>
</head>
<body>

<div id="toasts"></div>

<div class="receipt">
    <!-- header-->
    <div style="text-align: center; margin-bottom: 10px;">
        <div style="font-size: 20px; font-weight: bold;">INVESTBOT LTD.</div>
        <div style="font-size: 11px;">GST: 27AABCU9603R1ZX</div>
        <div style="font-size: 11px;">Mumbai, Maharashtra - 400001</div>
        <div style="font-size: 11px; margin-top: 5px;" id="receiptDate">DATE: </div>
    </div>

    <div class="dashed"></div>

    <!--theme/ looks & demo-->
    <div class="controls-row">
        <button id="themeBtn" onclick="toggleTheme()">[PHOSPHOR: GREEN]</button>
        <select id="demoToggle" onchange="toggleDemo()">
            <option value="true">DEMO: ON</option>
            <option value="false">DEMO: OFF</option>
        </select>
    </div>
    <div class="demo-badge" id="demoBadge">[DEMO_MODE: ON]</div>

    <div class="dashed"></div>

    <!--summary-->
    <div id="summary"></div>

    <div class="dashed"></div>

    <!--the market crash thing and yolo-->
    <button class="crash-btn" onclick="triggerCrash()">⚠️ SIMULATE MARKET CRASH ⚠️</button>
    <button class="yolo-btn" onclick="yoloAllIn()">🎲 YOLO ALL-IN 🎲</button>
    <button class="reset-btn" onclick="resetAll()">[SYSTEM_PURGE]</button>

    <div class="dashed"></div>

    <!--line chart thing so its nicely visible-->
    <h2>$ PRICE_CHART</h2>
    <div class="chart-controls">
        <select id="chartStock" onchange="renderChart()"></select>
        <div class="tf-buttons">
            <button id="tf-1d" onclick="setTimeframe('1d')">1D</button>
            <button id="tf-1wk" onclick="setTimeframe('1wk')">1W</button>
            <button id="tf-1mo" onclick="setTimeframe('1mo')">1M</button>
            <button id="tf-3mo" onclick="setTimeframe('3mo')">3M</button>
        </div>
    </div>
    <div class="chart-container">
        <canvas id="priceChart"></canvas>
    </div>
    <div id="signals" class="signals"></div>

    <div class="dashed"></div>

    <!--watchlist-->
    <h2>$ WATCHLIST</h2>
    <div class="controls-row">
        <select id="addStockSelect"></select>
        <button onclick="addToWatchlist()">[ADD]</button>
    </div>
    <div id="watchlist"></div>

    <div class="dashed"></div>

    <!--alerts-->
    <h2>$ ALERTS</h2>
    <div class="alert-section">
        <div class="alert-row">
            <select id="alertStock"></select>
            <select id="alertDir">
                <option value="above">ABOVE</option>
                <option value="below">BELOW</option>
            </select>
            <input type="number" id="alertPrice" placeholder="Price" style="width: 60px;">
            <button onclick="setAlert()">[SET]</button>
        </div>
    </div>
    <div id="alertsList"></div>

    <div class="dashed"></div>

    <!--buy/ sell log-->
    <h2>$ TRANSACTION_LOG</h2>
    <div id="transactions"></div>

    <div class="dashed"></div>

    <!-- FOOTER -->
    <div style="text-align: center; font-size: 11px; color: #666;">
        THANK YOU FOR TRADING<br>
        NO REFUNDS
    </div>
</div>

<script>
//stokc data
const ALL_STOCKS = {
    "TMCV.NS": "Tata Motors",
    "RELIANCE.NS": "Reliance Industries",
    "TCS.NS": "Tata Consultancy Services",
    "INFY.NS": "Infosys",
    "HDFCBANK.NS": "HDFC Bank",
    "ZOMATO.NS": "Zomato",
    "SBIN.NS": "State Bank of India",
    "BHARTIARTL.NS": "Bharti Airtel",
    "WIPRO.NS": "Wipro",
    "ADANIENT.NS": "Adani Enterprises",
    "HINDUNILVR.NS": "Hindustan Unilever",
    "ICICIBANK.NS": "ICICI Bank",
    "AXISBANK.NS": "Axis Bank",
    "ITC.NS": "ITC",
    "KOTAKBANK.NS": "Kotak Mahindra Bank",
    "LT.NS": "Larsen & Toubro",
    "MARUTI.NS": "Maruti Suzuki",
    "SUNPHARMA.NS": "Sun Pharma",
    "BAJFINANCE.NS": "Bajaj Finance",
    "ASIANPAINT.NS": "Asian Paints"
};

const DEMO_BASE = {
    "TMCV.NS": 445, "RELIANCE.NS": 1293, "TCS.NS": 2452,
    "INFY.NS": 1158, "HDFCBANK.NS": 739, "ZOMATO.NS": 280,
    "SBIN.NS": 620, "BHARTIARTL.NS": 1680, "WIPRO.NS": 285,
    "ADANIENT.NS": 2450, "HINDUNILVR.NS": 2450, "ICICIBANK.NS": 1280,
    "AXISBANK.NS": 980, "ITC.NS": 430, "KOTAKBANK.NS": 1780,
    "LT.NS": 3580, "MARUTI.NS": 11200, "SUNPHARMA.NS": 1780,
    "BAJFINANCE.NS": 6850, "ASIANPAINT.NS": 2350
};

var DEMO_PREV = {};
for (let sym in DEMO_BASE) {
    DEMO_PREV[sym] = Math.round(DEMO_BASE[sym] * (0.985 + Math.random() * 0.03) * 100) / 100;
}

const DEFAULT_DATA = {
    cash: 100000,
    portfolio: {},
    transactions: [],
    alerts: [],
    watchlist: ["TMCV.NS", "RELIANCE.NS", "TCS.NS", "INFY.NS", "HDFCBANK.NS", "ZOMATO.NS"]
};

for (let sym in ALL_STOCKS) {
    DEFAULT_DATA.portfolio[sym] = 0;
}

//storing
function loadData() {
    try {
        var saved = localStorage.getItem("investbot_data");
        if (saved) {
            var data = JSON.parse(saved);
            if (!data.portfolio) data.portfolio = {};
            if (!data.transactions) data.transactions = [];
            if (!data.alerts) data.alerts = [];
            if (!data.watchlist) data.watchlist = DEFAULT_DATA.watchlist;
            if (data.cash === undefined) data.cash = DEFAULT_DATA.cash;
            for (let sym in ALL_STOCKS) {
                if (data.portfolio[sym] === undefined) data.portfolio[sym] = 0;
            }
            return data;
        }
    } catch (e) {
        console.warn("Storage read failed:", e);
    }
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData() {
    try {
        localStorage.setItem("investbot_data", JSON.stringify(data));
    } catch (e) {
        console.warn("Storage write failed:", e);
    }
}

let data = loadData();
let currentTimeframe = "1mo";
let chartInstance = null;
let crashMode = false;
let crashMultiplier = 1.0;

// cacheing price
let priceCache = {};
let cacheTimestamp = 0;

//themse
function setTheme(theme) {
    var btn = document.getElementById('themeBtn');
    if (theme == 'amber') {
        document.body.classList.add('amber');
        if (btn) btn.textContent = '[PHOSPHOR: AMBER]';
    } else {
        document.body.classList.remove('amber');
        if (btn) btn.textContent = '[PHOSPHOR: GREEN]';
    }
    localStorage.setItem('investbot_theme', theme);
    updateChartColors();
}

function getTheme() {
    return localStorage.getItem('investbot_theme') || 'green';
}

function toggleTheme() {
    setTheme(getTheme() === 'green' ? 'amber' : 'green');
}

//demo prices which r the only option anyway
function getDemoPrice(symbol) {
    const now = Date.now();
    if (now - cacheTimestamp > 2000) {
        priceCache = {};
        cacheTimestamp = now;
    }
    if (priceCache[symbol] !== undefined) {
        return priceCache[symbol];
    }
    const base = DEMO_BASE[symbol] || 500;
    const wiggle = (Math.random() - 0.5) * 3;
    const normalPrice = Math.round((base + wiggle) * 100) / 100;
    const price = Math.round(normalPrice * crashMultiplier * 100) / 100;
    priceCache[symbol] = price;
    return price;
}

function getDemoYesterday(symbol) {
    return DEMO_PREV[symbol] || 500;
}

function getDemoChart(symbol, period) {
    const base = DEMO_BASE[symbol] || 500;
    let points, noiseRange, startMult;

    if (period === "1d") {
        points = 60; noiseRange = 0.8; startMult = 0.99;
    } else if (period === "1wk") {
        points = 7; noiseRange = 5; startMult = 0.97;
    } else if (period === "3mo") {
        points = 90; noiseRange = 15; startMult = 0.88;
    } else {
        points = 30; noiseRange = 8; startMult = 0.93;
    }

    var prices = [];
    var labels = [];
    var now = new Date();

    for (let i = 0; i < points; i++) {
        const trend = base * startMult + (base - base * startMult) * (i / points);
        const noise = (Math.random() - 0.5) * noiseRange * 2;
        prices.push(Math.round((trend + noise) * 100) / 100);

        var d = new Date(now);
        if (period === "1d") {
            d.setMinutes(d.getMinutes() - (points - i));
            labels.push(d.getHours() + ":" + String(d.getMinutes()).padStart(2, '0'));
        } else {
            d.setDate(d.getDate() - (points - i));
            labels.push((d.getMonth() + 1) + "/" + d.getDate());
        }
    }
    return { labels, prices };
}

function getChartColors() {
    var isAmber = getTheme() === 'amber';
    return {
        border: isAmber ? '#ffb000' : '#33ff00',
        bg: isAmber ? 'rgba(255, 176, 0, 0.08)' : 'rgba(51, 255, 0, 0.08)',
        grid: isAmber ? '#332200' : '#0d1f0d'
    };
}

function updateChartColors() {
    if (!chartInstance) return;
    var c = getChartColors();
    chartInstance.data.datasets[0].borderColor = c.border;
    chartInstance.data.datasets[0].backgroundColor = c.bg;
    chartInstance.options.scales.y.grid.color = c.grid;
    chartInstance.options.scales.x.ticks.color = c.border;
    chartInstance.options.scales.y.ticks.color = c.border;
    chartInstance.update();
}

//render
function renderSummary() {
    var prices = {};
    var yesterday = {};

    data.watchlist.forEach(sym => {
        prices[sym] = getDemoPrice(sym);
        yesterday[sym] = getDemoYesterday(sym);
    });

    for (let sym in data.portfolio) {
        if (data.portfolio[sym] > 0 && !prices[sym]) {
            prices[sym] = getDemoPrice(sym);
        }
    }

    var totalValue = data.cash;
    var invested = 0;

    for (let sym in data.portfolio) {
        var val = data.portfolio[sym] * (prices[sym] || 0);
        totalValue += val;
        invested += val;
    }

    var pnl = totalValue - 100000;
    var pnlPct = (pnl / 100000) * 100;
    var pnlClass = pnl >= 0 ? 'up' : 'down';
    var sign = pnl >= 0 ? '+' : '';

    document.getElementById('summary').innerHTML = `
        <div class="summary-grid">
            <div class="summary-cell">
                <h3>Cash Balance</h3>
                <div class="big-num">₹${data.cash.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
            </div>
            <div class="summary-cell">
                <h3>Invested</h3>
                <div class="big-num">₹${invested.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
            </div>
            <div class="summary-cell">
                <h3>Total Value</h3>
                <div class="big-num">₹${totalValue.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
            </div>
            <div class="summary-cell">
                <h3>P&L vs 1L</h3>
                <div class="big-num ${pnlClass}">${sign}₹${Math.abs(pnl).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                <div class="${pnlClass}" style="font-size:12px; font-weight:bold; margin-top:4px;">${sign}${pnlPct.toFixed(2)}%</div>
            </div>
        </div>
    `;
}

function renderWatchlist() {
    var container = document.getElementById('watchlist');
    container.innerHTML = '';

    data.watchlist.forEach(sym => {
        var price = getDemoPrice(sym);
        var prev = getDemoYesterday(sym);
        var change = price - prev;
        var changePct = prev !== 0 ? (change / prev) * 100 : 0;
        var shares = data.portfolio[sym] || 0;
        var isUp = change >= 0;
        var sign = isUp ? '+' : '-';
        var borderClass = isUp ? 'green-border' : 'red-border';

        var cell = document.createElement('div');
        cell.className = `stock-cell ${borderClass}`;
        cell.innerHTML = `
            <div class="stock-top">
                <div>
                    <div class="stock-name">${ALL_STOCKS[sym]}</div>
                    <div class="stock-ticker">${sym}</div>
                </div>
                <button onclick="removeFromWatchlist('${sym}')" style="background:none; border:none; cursor:pointer; font-size:16px; color:#1a800d;">[x]</button>
            </div>
            <div class="stock-price">₹${price.toFixed(2)}</div>
            <div class="stock-change ${isUp ? 'up' : 'down'}">
                ${sign}₹${Math.abs(change).toFixed(2)} (${sign}${Math.abs(changePct).toFixed(2)}%)
            </div>
            <div class="stock-owned">OWNED: ${shares} | VAL: ₹${(shares * price).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
            <div class="trade-row">
                <input type="number" id="buy-qty-${sym}" value="1" min="1" max="100">
                <button class="buy-btn" onclick="buyStock('${sym}')">BUY</button>
                <input type="number" id="sell-qty-${sym}" value="1" min="1" max="${shares || 1}">
                <button class="sell-btn" onclick="sellStock('${sym}')">SELL</button>
            </div>
        `;
        container.appendChild(cell);
    });
}

function renderTransactions() {
    var container = document.getElementById('transactions');

    if (data.transactions.length === 0) {
        container.innerHTML = '<div class="empty">[LOG_EMPTY] No trades executed. Awaiting input...</div>';
        return;
    }

//indicators
function movingAverage(prices, window) {
    var result = [];
    for (let i = 0; i < prices.length; i++) {
        if (i < window - 1) {
            result.push(null);
        } else {
            var sum = 0;
            for (var j = 0; j < window; j++) {
                sum += prices[i - j];
            }
            result.push(sum / window);
        }
    }
    return result;
}

function computeRSI(prices) {
    var period = 14;
    if (prices.length < period + 1) return null;

    var gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) {
        var change = prices[prices.length - i] - prices[prices.length - i - 1];
        if (change > 0) gains += change;
        else losses += Math.abs(change);
    }

    var avgGain = gains / period;
    var avgLoss = losses / period;
    if (avgLoss === 0) return 100;
    var rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
}

function computeMACD(prices) {
    function ema(prices, span) {
        var k = 2 / (span + 1);
        var result = [prices[0]];
        for (let i = 1; i < prices.length; i++) {
            result.push(prices[i] * k + result[i-1] * (1 - k));
        }
        return result;
    }

    var ema12 = ema(prices, 12);
    var ema26 = ema(prices, 26);
    var macdLine = ema12.map((v, i) => v - ema26[i]);
    var signalLine = ema(macdLine, 9);

    return {
        latestMacd: macdLine[macdLine.length - 1],
        latestSignal: signalLine[signalLine.length - 1]
    };
}

function computeBollinger(prices) {
    var window = 20;
    if (prices.length < window) return null;

    var sum = 0;
    for (let i = prices.length - window; i < prices.length; i++) {
        sum += prices[i];
    }
    var ma = sum / window;

    var sqSum = 0;
    for (let i = prices.length - window; i < prices.length; i++) {
        sqSum += Math.pow(prices[i] - ma, 2);
    }
    var std = Math.sqrt(sqSum / window);

    return { upper: ma + 2 * std, lower: ma - 2 * std };
}

function renderSignals(sym, prices) {
    var ma20 = movingAverage(prices, 20);
    var ma50 = movingAverage(prices, 50);

    var latest20 = ma20[ma20.length - 1];
    var latest50 = ma50[ma50.length - 1];

    var rsi = computeRSI(prices);
    var macd = computeMACD(prices);
    var bb = computeBollinger(prices);
    var latestPrice = prices[prices.length - 1];

    var crossSignal, crossClass;
    if (latest20 === null || latest50 === null) {
        crossSignal = "MA_N/A // LOW_DATA";
        crossClass = "sig-hold";
    } else if (latest20 > latest50) {
        crossSignal = "GOLDEN_CROSS // BUY";
        crossClass = "sig-buy";
    } else if (latest20 < latest50) {
        crossSignal = "DEATH_CROSS // SELL";
        crossClass = "sig-sell";
    } else {
        crossSignal = "NEUTRAL // HOLD";
        crossClass = "sig-hold";
    }

    var rsiSignal, rsiClass;
    if (rsi === null) {
        rsiSignal = "RSI_N/A // LOW_DATA";
        rsiClass = "sig-hold";
    } else if (rsi > 70) {
        rsiSignal = `RSI_${rsi.toFixed(1)} // OVERBOUGHT`;
        rsiClass = "sig-sell";
    } else if (rsi < 30) {
        rsiSignal = `RSI_${rsi.toFixed(1)} // OVERSOLD`;
        rsiClass = "sig-buy";
    } else {
        rsiSignal = `RSI_${rsi.toFixed(1)} // NORMAL`;
        rsiClass = "sig-hold";
    }

    var macdSignal, macdClass;
    if (macd.latestMacd > macd.latestSignal) {
        macdSignal = "MACD_BULLISH";
        macdClass = "sig-buy";
    } else {
        macdSignal = "MACD_BEARISH";
        macdClass = "sig-sell";
    }

    var bbSignal, bbClass;
    if (bb === null) {
        bbSignal = "BB_N/A // LOW_DATA";
        bbClass = "sig-hold";
    } else if (latestPrice > bb.upper) {
        bbSignal = "ABOVE_BB // OVERBOUGHT";
        bbClass = "sig-sell";
    } else if (latestPrice < bb.lower) {
        bbSignal = "BELOW_BB // OVERSOLD";
        bbClass = "sig-buy";
    } else {
        bbSignal = "INSIDE_BB";
        bbClass = "sig-hold";
    }

    document.getElementById('signals').innerHTML = `
        <div class="signal ${crossClass}">${crossSignal}</div>
        <div class="signal ${rsiClass}">${rsiSignal}</div>
        <div class="signal ${macdClass}">${macdSignal}</div>
        <div class="signal ${bbClass}">${bbSignal}</div>
    `;
}

//the acc trading part
function buyStock(sym) {
    var qtyInput = document.getElementById(`buy-qty-${sym}`);
    var qty = parseInt(qtyInput.value) || 1;
    var price = getDemoPrice(sym);
    var total = qty * price;

    if (data.cash >= total) {
        data.cash -= total;
        data.portfolio[sym] += qty;
        data.transactions.unshift({
            time: new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
            action: "BUY",
            symbol: sym,
            name: ALL_STOCKS[sym],
            qty: qty,
            price: Math.round(price * 100) / 100,
            total: Math.round(total * 100) / 100
        });
        saveData();
        renderAll();
        showToast(`[EXECUTED] BUY ${qty} ${sym}`, false);
    } else {
        showToast("[ERROR] INSUFFICIENT_FUNDS", true);
    }
}

function sellStock(sym) {
    var qtyInput = document.getElementById(`sell-qty-${sym}`);
    var qty = parseInt(qtyInput.value) || 1;
    var price = getDemoPrice(sym);
    var total = qty * price;

    if (data.portfolio[sym] >= qty) {
        data.cash += total;
        data.portfolio[sym] -= qty;
        data.transactions.unshift({
            time: new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
            action: "SELL",
            symbol: sym,
            name: ALL_STOCKS[sym],
            qty: qty,
            price: Math.round(price * 100) / 100,
            total: Math.round(total * 100) / 100
        });
        saveData();
        renderAll();
        showToast(`[EXECUTED] SELL ${qty} ${sym}`, false);
    } else {
        showToast("[ERROR] INSUFFICIENT_SHARES", true);
    }
}

//the al in thing where it buys howmuchever with whatever money u hv
function yoloAllIn() {
    if (data.cash <= 0) {
        showToast("[ERROR] BALANCE_ZERO", true);
        return;
    }

    var round = 1;
    var totalSpent = 0;
    var totalSharesBought = 0;
    var boughtInRound = true;
    var txns = [];

    while (boughtInRound) {
        boughtInRound = false;

        for (var i = 0; i < data.watchlist.length; i++) {
            var sym = data.watchlist[i];
            var price = getDemoPrice(sym);
            var cost = round * price;

            if (data.cash >= cost) {
                data.cash -= cost;
                data.portfolio[sym] += round;
                totalSpent += cost;
                totalSharesBought += round;
                boughtInRound = true;

                txns.push({
                    time: new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
                    action: "BUY",
                    symbol: sym,
                    name: ALL_STOCKS[sym],
                    qty: round,
                    price: Math.round(price * 100) / 100,
                    total: Math.round(cost * 100) / 100
                });
            }
        }

        if (boughtInRound) round++;
    }

    data.transactions = txns.reverse().concat(data.transactions);
    saveData();
    renderAll();

    var roundsDone = round - 1;
    showToast(`[YOLO] ${roundsDone} ROUNDS | ₹${Math.round(totalSpent).toLocaleString('en-IN')} | ${totalSharesBought} SHARES`, false);
}

function addToWatchlist() {

        data.watchlist.push(sym);

function removeFromWatchlist(sym) {
    data.watchlist = data.watchlist.filter(s => s !== sym);

function setAlert() {
    var sym = document.getElementById('alertStock').value;
    var dir = document.getElementById('alertDir').value;
    var target = parseFloat(document.getElementById('alertPrice').value);

    if (sym && target > 0) {
        data.alerts.push({
            symbol: sym,
            direction: dir,
            target: target,
            setTime: new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        });
        saveData();
        renderAlerts();
        showToast(`[ALERT_SET] ${sym}`, false);
    }
}

function deleteAlert(index) {
    data.alerts.splice(index, 1);
    saveData();
    renderAlerts();
}

function checkAlerts() {
    var anyTriggered = false;
    var remaining = [];

    data.alerts.forEach(alert => {
        var price = getDemoPrice(alert.symbol);
        var triggered = false;

        if (alert.direction === 'above' && price >= alert.target) triggered = true;
        if (alert.direction === 'below' && price <= alert.target) triggered = true;

        if (triggered) {
            showToast(`[ALERT] ${ALL_STOCKS[alert.symbol]} TRIGGERED`, true);
            anyTriggered = true;
        } else {
            remaining.push(alert);
        }
    });

    if (anyTriggered) {
        data.alerts = remaining;
        saveData();
        renderAlerts();
    }
}

    container.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
    }, 3000);
}
